name: Prueba de fluidez (WebKit)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  medir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python build.py && cp -r assets _site/
          pip install playwright==1.48.0 && python -m playwright install --with-deps webkit
          (cd _site && python -m http.server 8765 &) ; sleep 2
          python pruebas/fps.py
