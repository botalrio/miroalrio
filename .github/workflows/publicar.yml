name: Publicar
# Cada hora lee el RSS de Substack, arma la página y la publica en GitHub Pages.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Armar la página desde Substack
        run: |
          python build.py
          cp -r assets _site/
          [ -f CNAME ] && cp CNAME _site/ || true
      - name: Guardar la lista de artículos si cambió
        run: |
          if ! git diff --quiet data/posts.json; then
            git config user.name "miroalrio-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Periódico: nuevo artículo en Substack"
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
